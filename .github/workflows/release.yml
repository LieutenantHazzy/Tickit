name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist/tickit
          cp target/x86_64-unknown-linux-gnu/release/tickit dist/tickit/
          cp -r assets dist/tickit/
          cp systemd/tickit.service dist/tickit/
          cp .env.example dist/tickit/
          tar czf tickit-${{ github.ref_name }}-x86_64-linux.tar.gz -C dist .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: tickit-${{ github.ref_name }}-x86_64-linux.tar.gz